# Вариант для GitLab. Нужны переменные: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY.
stages: [test, build, deploy]

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - |
      STATE_FILE=/tmp/state.json python - <<'PY'
      import app
      c = app.app.test_client()
      assert c.get('/health').status_code == 200
      assert c.post('/click').status_code == 200
      print('OK')
      PY

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  only: [main]

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SERVER_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$SERVER_USER@$SERVER_HOST" "cd ~/student-clicker && ./scripts/deploy.sh"
  only: [main]
