global:
  scrape_interval: 10s
  scrape_timeout: 8s
scrape_configs:
  - job_name: 'student-clicker'
    static_configs:
      - targets: ['localhost:5000']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8081']
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
